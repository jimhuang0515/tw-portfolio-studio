services:
  - type: web
    name: tw-portfolio-studio
    runtime: python
    plan: starter
    region: singapore
    buildCommand: "echo No external Python packages needed"
    startCommand: python app.py
    envVars:
      - key: CLOUD_MODE
        value: "1"
      - key: HOST
        value: 0.0.0.0
      - key: PORTFOLIO_DB
        value: /data/portfolio.sqlite3
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: FINMIND_TOKEN
        sync: false
    disk:
      name: portfolio-data
      mountPath: /data
      sizeGB: 1
